<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Hello, world!</title>
</head>

<body>
    <!-- jumbotron -->
    <div class="jumbotron jumbotron-fluid text-center">
        <div class="container">
            <img src="profil.png" class="rounded-circle img-thumbnail" alt="Profile Picture">
            <h1>Santri Gameshop</h1>
            <p>Web Developer</p>
        </div>
    </div>
    <!-- Akhir jumbotron -->

    <!-- about -->
    <section class="about" id="about">
        <div class="container">
            <div class="row text-center">
                <div class="col-12">
                    <h2>About</h2>
                    <hr>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-5 offset-sm-1">
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ducimus, sit! Numquam, deleniti vero...</p>
                </div>

                <div class="col-sm-5">
                    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quis cum delectus sit id aliquam...</p>
                </div>
            </div>
        </div>
    </section>
    <!-- Akhir about -->

    <!-- Gallery -->
    <section class="gallery" id="gallery">
        <div class="container">
            <div class="row text-center">
                <div class="col-lg-12">
                    <h2>Gallery</h2>
                    <hr>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-4">
                    <a href="img/gambar5.jpg" data-toggle="lightbox" data-gallery="example-gallery">
                        <img src="Mie level.jpg" alt="Gallery Image 1" class="img-fluid img-thumbnail">
                    </a>
                </div>

                <div class="col-lg-4">
                    <a href="img/gambar7.jpg" data-toggle="lightbox" data-gallery="example-gallery">
                        <img src="brosur.jpg" alt="Gallery Image 2" class="img-fluid img-thumbnail">
                    </a>
                </div>

                <div class="col-lg-4">
                    <a href="img/gambar8.jpg" data-toggle="lightbox" data-gallery="example-gallery">
                        <img src="Tumpeng Ikan.jpg" alt="Gallery Image 3" class="img-fluid img-thumbnail">
                    </a>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-4">
                    <a href="img/download (2).jpg" data-toggle="lightbox" data-gallery="example-gallery">
                        <img src="Promosi Poster.jpg" alt="Gallery Image 4" class="img-fluid img-thumbnail">
                    </a>
                </div>

                <div class="col-lg-4">
                    <a href="img/download (3).jpg" data-toggle="lightbox" data-gallery="example-gallery">
                        <img src="Jajanan.jpg" alt="Gallery Image 5" class="img-fluid img-thumbnail">
                    </a>
                </div>

                <div class="col-lg-4">
                    <a href="img/download (3).jpg" data-toggle="lightbox" data-gallery="example-gallery">
                        <img src="all in.jpg" alt="Gallery Image" class="img-fluid img-thumbnail">
                    </a>
                </div>
            </div>
        </div>
    </section>
    <!-- Akhir Gallery -->

    <!-- Contact -->
    <section class="contact mt-4 mb-4" id="contact">
        <div class="container">
            <div class="row text-center">
                <div class="col-12">
                    <h2>Contact</h2>
                    <hr>
                </div>
            </div>

            <form class="col-8 offset-2">
                <div class="form-group">
                    <label for="Nama">Nama</label>
                    <input type="text" class="form-control" id="Nama" placeholder="Masukan Nama">
                </div>
                <div class="form-group">
                    <label for="Email">Email</label>
                    <input type="email" class="form-control" id="Email" placeholder="Masukan Email">
                </div>
                <div class="form-group">
                    <label for="Pesan">Pesan</label>
                    <textarea class="form-control" id="Pesan" placeholder="Masukan Pesan" rows="5"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </section>
    <!-- Akhir contact -->

    <!-- Footer -->
    <footer class="footer pt-1 pb-1 text-center" id="footer">
        <div class="row">
            <div class="col-12">
                <small>&copy; 2025 All Rights Reserved By Santri Gameshop</small>
            </div>
        </div>
    </footer>
    <!-- Akhir footer -->

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bs5-lightbox@1.0.0/dist/index.bundle.min.js"></script>
</body>
</html>
